name: Release

# 打 tag（v*）自动构建三平台产物并发布 pre-release。
# 手动触发（Actions → Release → Run workflow）只构建并上传 artifact，不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: macos-arm64
          # Intel 用 x64 镜像原生构建，产物才能在本机跑 smoke test；
          # macos-latest 是 arm64，交叉编出来的 amd64 二进制没法验证
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            asset: macos-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # static/ 未入库（.gitignore 排除），必须先在 CI 里构建前端，go:embed 才有内容
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          # 与 CI 一致：macOS 26 需要 Go 1.23+ 才会写 LC_UUID
          go-version: '1.24.x'
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          BIN=dist/mimo-web2api
          if [ "$GOOS" = "windows" ]; then BIN=dist/mimo-web2api.exe; fi
          go build -trimpath -ldflags "-s -w" -o "$BIN" .
          ls -lh dist

      # 发布前先让产物自己跑一遍内部测试：起得来、管理接口通、全链路通，才允许打包
      - name: Smoke test the release binary
        shell: bash
        run: |
          BIN=dist/mimo-web2api
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          MIMO_BIN="$BIN" node test/run.mjs --tag offline --report-dir test-results
          MIMO_BIN="$BIN" node test/run.mjs --tag e2e --concurrency 2 --report-dir test-results

      # ---------- Windows：zip ----------
      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Copy-Item config.example.json dist/
          Compress-Archive -Path dist/* -DestinationPath "mimo-web2api-${{ matrix.asset }}.zip"

      # ---------- Linux：tar.gz ----------
      - name: Package (Linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          cp config.example.json dist/
          tar -czf "mimo-web2api-${{ matrix.asset }}.tar.gz" -C dist .

      # ---------- macOS：.app bundle + dmg ----------
      - name: Package (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) VERSION="0.0.0" ;;
          esac
          APP="dist/MiMo Web2API.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv dist/mimo-web2api "$APP/Contents/MacOS/mimo-web2api"
          chmod +x "$APP/Contents/MacOS/mimo-web2api"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MiMo Web2API</string>
            <key>CFBundleDisplayName</key><string>MiMo Web2API</string>
            <key>CFBundleIdentifier</key><string>com.teddyli18000.mimo-web2api</string>
            <key>CFBundleExecutable</key><string>mimo-web2api</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # 无开发者证书，做 ad-hoc 签名让 bundle 结构合法（不解决 Gatekeeper 拦截）
          codesign --force --deep --sign - "$APP" 2>/dev/null || true

          cp config.example.json dist/
          cat > dist/使用说明.txt <<'TXT'
          MiMo Web2API for macOS

          首次打开（未签名，macOS 会拦截）：
            右键点击 "MiMo Web2API.app" → 打开 → 在弹窗里再点"打开"
          或执行：
            xattr -dr com.apple.quarantine "/Applications/MiMo Web2API.app"

          使用：
            双击 App，浏览器自动打开面板 http://localhost:8080
            在面板里填入 MiMo Cookie 即可

          配置位置：
            ~/Library/Application Support/mimo-web2api/
          TXT

          hdiutil create -volname "MiMo Web2API" -srcfolder dist -ov -format UDZO \
            "mimo-web2api-${{ matrix.asset }}.dmg"
          ls -lh *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            *.zip
            *.tar.gz
            *.dmg
          if-no-files-found: error

  # 浏览器扩展独立发一个 zip：主包结构不动，用户按需取。
  # 没有签名与 crx —— Chrome 75 起非商店 crx 在 Windows/macOS 会被直接拒装，
  # 发 zip + 「加载已解压」是唯一对普通用户可行的路径。
  extension:
    name: Package browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 扩展版本跟随 tag（去掉 v）；手动触发或非法 tag 退化为 0.0.0。
      # Chrome 只接受 1~4 段纯整数的 version，所以这里先按格式校验。
      - name: Resolve version
        id: ver
        run: |
          VERSION=""
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "extension version: $VERSION"

      # 与 CI 共用同一份打包脚本：顶层目录、版本注入、清单校验都在脚本里，
      # 两条流水线不会各写一遍再各自漂移
      - name: Package extension
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash .github/pack-extension.sh "$VERSION" .

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: "*.zip"
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 对最终产物断言，而不是对 dist/ 断言：
      # dist/ 是白名单 cp 出来的，永远不会有 test/，那种断言恒真。
      # dmg 需要挂载才能查，这里不覆盖（打包前的 dist 本来就是白名单）。
      - name: Assert packages contain no test assets
        shell: bash
        run: |
          shopt -s nullglob
          fail=0
          for z in artifacts/*.zip; do
            if unzip -Z1 "$z" | grep -qE '(^|/)test/'; then
              echo "::error::$z contains test/"; fail=1
            fi
          done
          for t in artifacts/*.tar.gz; do
            if tar -tzf "$t" | grep -qE '(^|/)test/'; then
              echo "::error::$t contains test/"; fail=1
            fi
          done
          exit $fail

      - name: List assets
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # 安装细节留在 README，不在这里复述；但扩展是新增的独立资产，
          # 不写一句「解压后加载」没人知道它不是双击安装的。具体变更由维护者补充。
          body: |
            Windows / macOS (arm64 · amd64) / Linux 三平台构建，外加浏览器扩展。

            **软件本体**：下载对应平台的包，解压即用。安装与客户端接入见 [README](https://github.com/teddyli18000/mimo-web2api#readme)。

            **浏览器扩展**（`mimo-web2api-extension-*.zip`）：解压后打开 `chrome://extensions`，开启「开发者模式」，点「加载已解压的扩展程序」，选中解压出的 `mimo-web2api-extension` 目录。填入网关地址与 API Key 后点一次，即可把 MiMo 登录态写进账号池；同一账号重复同步只更新，不会新增。
